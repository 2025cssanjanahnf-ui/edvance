services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edvance_platform
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=edvance-super-secret-jwt-key-2024-change-in-production-random-hash
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DATABASE_URL=sqlite:///./edvance.db
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE_MB=25
      - ENVIRONMENT=production
    volumes:
      - edvance_data:/app/uploads
      - edvance_db:/app
    restart: unless-stopped

volumes:
  edvance_data:
  edvance_db:

